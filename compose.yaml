# pulse on our server: the dashboard, the API, the site (on Postgres) and its worker stay up;
# `job` runs commands on demand.
#
#   docker compose build
#   docker compose run --rm job synth --data-dir /srv/pulse/customers/demo/data/synth
#   docker compose run --rm job python -m pulse_flow.run --no-llm ...   (see DEPLOY.md)
#   docker compose up -d                  (needs .env with PULSE_SECRET_KEY: see .env.example)
#
# Ports listen on the server's localhost only and are reached through an SSH tunnel (DEPLOY.md):
# the dashboard and the API have no login. PULSE_CUSTOMER picks the customer folder the
# dashboard and the API show (default: demo). Postgres publishes no port at all.

name: pulse

x-pulse: &pulse
  build: .
  image: pulse:local
  env_file:
    - path: .env
      required: false
  environment:
    ARTIFACTS_DIR: /srv/pulse/customers/${PULSE_CUSTOMER:-demo}/artifacts
    RUNS_DIR: /srv/pulse/customers/${PULSE_CUSTOMER:-demo}/runs
  volumes:
    - pulse-data:/srv/pulse

# The site's server and its worker share the database, the customer folders and a work folder.
x-server-env: &server-env
  PULSE_DATABASE_URL: postgresql+psycopg://pulse:${POSTGRES_PASSWORD:-pulse}@postgres:5432/pulse
  PULSE_CUSTOMERS_ROOT: /srv/pulse/customers
  PULSE_WORK_DIR: /srv/pulse/work

services:
  dashboard:
    <<: *pulse
    command:
      - streamlit
      - run
      - frontend/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.fileWatcherType=none
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  api:
    <<: *pulse
    command: ["pulse-api"]
    environment:
      ARTIFACTS_DIR: /srv/pulse/customers/${PULSE_CUSTOMER:-demo}/artifacts
      RUNS_DIR: /srv/pulse/customers/${PULSE_CUSTOMER:-demo}/runs
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # The site's backend: sign-in, companies, the operator's approval. Migrates on start.
  server:
    <<: *pulse
    command: ["pulse-server", "serve", "--migrate"]
    environment:
      <<: *server-env
      PORT: "8100"
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Uploads, ingestion and pipeline runs, one at a time (a step holds a whole export in memory).
  worker:
    <<: *pulse
    command: ["pulse-server", "worker"]
    environment:
      <<: *server-env
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 6g

  # The server's database on this machine (step 6.9 moves it to a managed Postgres).
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pulse
      POSTGRES_DB: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
    volumes:
      - pulse-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

  # Not started by `up`: `docker compose run --rm job <command>`.
  job:
    <<: *pulse
    profiles: [job]
    command: ["python", "-m", "pulse_flow.run", "--help"]

volumes:
  pulse-data:
  pulse-db:
