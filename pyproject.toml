[project]
name = "pulse"
version = "0.1.0"
description = "pulse: a CrewAI Flow that turns a dataset spec into a validated, documented prediction model (Data Analyst crew -> Data Scientist crew, three gates)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
authors = [{ name = "matanelsh" }]
dependencies = [
    "crewai[google-genai]==1.14.5",
    "pandas>=2.3,<2.4",
    "numpy>=2.3,<2.4",
    "scikit-learn==1.7.2",
    "matplotlib>=3.10,<3.11",
    "seaborn>=0.13,<0.14",
    "joblib>=1.5,<2",
    "threadpoolctl>=3.5",
    "flask>=3.1,<3.2",
    "waitress>=3.0,<4",
    "python-dotenv>=1.1",
    "requests>=2.32",
    "pyyaml>=6",
    # ingestion: Excel sheets, encoding detection, staged tables
    "openpyxl>=3.1,<4",
    "charset-normalizer>=3.4,<4",
    "pyarrow>=21",
    # the server: web framework, database and migrations, sign-in (OIDC), settings
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.54,<0.55",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "httpx>=0.28,<0.29",
    "pyjwt[crypto]>=2.15,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-timeout>=2.3",
    "python-pptx>=1.0",
    "ruff>=0.12,<0.13",
]
# The dashboard (installed in the Docker image next to the runtime dependencies).
frontend = [
    "streamlit>=1.51,<1.52",
    "pandas>=2.3,<2.4",
    "numpy>=2.3,<2.4",
    "scikit-learn==1.7.2",
    "joblib>=1.5,<2",
    "requests>=2.32",
    "google-genai==1.65.0",
]

[project.scripts]
kickoff = "pulse_flow.run:kickoff"
plot = "pulse_flow.run:plot"
pulse-api = "pulse_api.serve:main"
synth = "pulse_specs.workforce_saas.synth:main"
pulse-ingest = "pulse_ingest.cli:main"
pulse-server = "pulse_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "backend/pulse_core",
    "backend/pulse_flow",
    "backend/pulse_api",
    "backend/pulse_copilot",
    "backend/pulse_specs",
    "backend/pulse_ingest",
    "backend/pulse_server",
]

[tool.crewai]
type = "flow"

[tool.uv]
default-groups = ["dev", "frontend"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend", "frontend", "scripts", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The formatter enforces line length for code; long user-facing strings are allowed.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "frontend/tests"]
pythonpath = ["backend", "frontend"]
markers = [
    "llm: live Gemini tests (deselected by default)",
    "slow: full-data runs (deselected by default)",
]
addopts = "-m 'not llm and not slow' --timeout=300 --timeout-method=thread"
filterwarnings = [
    "ignore::DeprecationWarning:crewai.*",
    # FastAPI's TestClient still runs on httpx (the server itself does not use the test client)
    "ignore:Using `httpx` with `starlette.testclient`",
]
